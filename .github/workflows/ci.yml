name: CI

on:
  push:
  pull_request:

jobs:
  sqlite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: python -m reportkit load
      - run: pytest -q

  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres   # throwaway password for the CI container only
          POSTGRES_DB: sakila
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/sakila
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev,postgres]"
      - name: Load Sakila into PostgreSQL
        run: |
          base=https://raw.githubusercontent.com/jOOQ/sakila/main/postgres-sakila-db
          curl -sSfL "$base/postgres-sakila-schema.sql" | psql -h localhost -U postgres -d sakila -q -v ON_ERROR_STOP=1
          curl -sSfL "$base/postgres-sakila-insert-data-using-copy.sql" | psql -h localhost -U postgres -d sakila -q -v ON_ERROR_STOP=1
      - run: pytest -q
